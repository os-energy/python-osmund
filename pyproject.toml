[project]
name = "osmund"
version = "0.2.0"
description = "Async client for the Osmund API: electricity prices, consumption, cost and invoices"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["aiohttp>=3.9"]
classifiers = [
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Documentation = "https://osmundenergi.dk/docs/osmund-api/"
Source = "https://github.com/os-energy/python-osmund"
Issues = "https://github.com/os-energy/python-osmund/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1",
    "ruff>=0.14",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "PL", "DTZ", "T20"]
ignore = ["PLR2004", "PLR0913", "PLR0911"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T20"]
